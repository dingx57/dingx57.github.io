name: Update latest news

on:
  # Every 3 hours (times are UTC). Change or remove as you like.
  schedule:
    - cron: "17 */3 * * *"
  # Adds a "Run workflow" button on the Actions tab, for right after you post news.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save --no-package-lock cheerio@1.0.0

      - name: Build news.json from the News page
        run: node scripts/build-news.mjs news.json

      - name: Save news.json if the news changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No change in the latest news."
          else
            git commit -m "Update latest news"
            git push
          fi
